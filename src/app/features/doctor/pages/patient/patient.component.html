<div class="p-6 max-w-7xl mx-auto space-y-6">
  
  <!-- Loading State -->
  @if(loading()){
    <div class="flex items-center justify-center min-h-[50vh]">
      <div class="flex flex-col items-center space-y-4">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
        <h1 class="text-xl font-semibold text-gray-700 animate-pulse">Loading Patients...</h1>
      </div>
    </div>
  }
  
  <!-- Error State -->
  @else if(error()){
    <div class="flex flex-col items-center justify-center min-h-[50vh] space-y-4 p-6 text-center max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-100 text-red-600">
        <span 
          class="brand-icon inline-block cursor-pointer bg-red-600 w-6 h-6"
          style="
            mask-image: url('close.svg'); 
            -webkit-mask-image: url('close.svg');
            mask-size: contain;
            mask-repeat: no-repeat;
          "
        ></span>
      </div>

      <div>
        <h3 class="text-lg font-semibold text-gray-900">Connection Error</h3>
        <p class="text-sm text-gray-500 mt-1 leading-relaxed">
          {{ error() }}
        </p>
      </div>

      <button 
        (click)="loadPatients(doctorId)" 
        class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-colors w-full sm:w-auto">
        Retry Connection
      </button>
    </div>
  }
  
  <!-- Content State -->
  @else {
    <!-- Unified Section Header & Search Input Controls Layout -->
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between pb-2 border-b border-gray-200">
      <div>
        <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Manage Patients</h2>
        <p class="text-sm text-gray-500 mt-0.5">View and manage all registered patients</p>
      </div>
      
      <!-- Search Engine Box Component Wrapper -->
      <div class="w-full sm:w-72 md:w-80 relative flex items-center">
        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
          <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input
          type="text"
          placeholder="Search patient by name..."
          [value]="searchTerm()"
          (input)="updateSearchTerm($event)"
          class="block w-full rounded-lg border border-gray-300 bg-white py-2 pl-10 pr-3 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none transition-all"
        />
      </div>
    </div>
  
    <!-- Main Angular Reusable Data Table Wrapper -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mx-auto">
      <app-data-table
        [columns]="patientColumns"
        [data]="filteredPatients()"
        [actions]="patientActions"
        [emptyStateMessage]="searchTerm() ? 'No matching patients found' : 'No patients found'"
        (actionTriggered)="onPatientTableAction($event)"
      ></app-data-table>
    </div>
  
    <!-- Dynamic Patient Form Overlay Modal Component -->
    @if(showPatientModal) {
      <app-modal-form
        [config]="patientModalConfig"
        [fields]="patientModalFields"
        (submitted)="onSubmit($event)"
        (cancelled)="showPatientModal = false"
        (backdropClicked)="showPatientModal = false"
      >
      </app-modal-form>
    }
  }
</div>
