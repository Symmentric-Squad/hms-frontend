<div class="p-6">
  <div class="section-header">
    <div>
      <h2>Manage Patients</h2>
      <p>View and manage all registered patients</p>
    </div>
    <button class="add-btn" (click)="openAddPatient()">+ Add Patient</button>
  </div>

  <app-data-table
    [columns]="patientColumns"
    [data]="patients"
    [actions]="patientActions"
    [emptyStateMessage]="'No patients found'"
    (actionTriggered)="onTableAction($event)"
  ></app-data-table>

  <!-- Patient Modal -->
  @if(showPatientModal) {
  <div class="modal-overlay" (click)="showPatientModal = false">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ isEditMode ? 'Edit Patient' : 'Add Patient' }}</h3>
        <button class="modal-close" (click)="showPatientModal = false">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-field">
            <label>Name</label>
            <input type="text" (ngModel)="editingPatient.name" placeholder="Patient name" />
          </div>
          <div class="form-field">
            <label>Age</label>
            <input type="number" (ngModel)="editingPatient.age" placeholder="Age" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>Phone</label>
            <input type="text" (ngModel)="editingPatient.phone" placeholder="Phone number" />
          </div>
          <div class="form-field">
            <label>Blood Group</label>
            <select (ngModel)="editingPatient.bloodGroup">
              <option value="">Select Blood Group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label>Assigned Doctor</label>
          <select (ngModel)="editingPatient.doctor">
            <option value="">Select Doctor</option>
            <option *ngFor="let d of doctorNames" [value]="d">{{ d }}</option>
          </select>
        </div>
        <div class="form-field">
          <label>Status</label>
          <select (ngModel)="editingPatient.status">
            <option value="Active">Active</option>
            <option value="Discharged">Discharged</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="cancel-btn" (click)="showPatientModal = false">Cancel</button>
        <button class="save-btn" (click)="savePatient()">{{ isEditMode ? 'Update' : 'Add' }}</button>
      </div>
    </div>
  </div>
  }
</div>
