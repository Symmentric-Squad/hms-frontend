<div class="section-header">
  <h2>Welcome Back, Patient</h2>
  <!-- <p>Here's an overview of the hospital today</p> -->
</div>

<div class="stat-grid">
  @for(cardDetail of cardDetails; track $index){
  <div [ngClass]="cardDetail.cardColor" (click)="cardDetail.action()"
    class="flex items-center gap-5 p-6 bg-white rounded-2xl border border-slate-200 shadow-sm cursor-pointer transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">

    <!-- Icon Wrapper (Forced to 64px / size-16) -->
    <div class="flex items-center justify-center size-16 shrink-0">
      <!-- SVG Mask with Dynamic Color Matching the Card -->
      <div class="w-full h-full bg-[length:contain] bg-center bg-no-repeat"
        [style.background-color]="cardDetail.cardColor" [style.mask-image]="'url(' + cardDetail.icon + ')'"
        [style.webkit-mask-image]="'url(' + cardDetail.icon + ')'">
      </div>
    </div>

    <!-- Text Info -->
    <div class="flex flex-col gap-1">
      <span class="text-2xl font-extrabold text-slate-900 leading-none tracking-tight">
        {{ cardDetail.value }}
      </span>
      <span class="text-sm font-medium text-slate-500">
        {{ cardDetail.label }}
      </span>
    </div>
  </div>
  }
</div>
<div class="dash-panel">
  <div class="panel-header">
    <h3>Recent Appointments</h3>
    <button class="view-all-btn">View All →</button>
  </div>
  <app-data-table [columns]="appointmentColumns" [data]="appointments()" [actions]="[]"
    [emptyStateMessage]="'No appointments found'"></app-data-table>
</div>

@if(showBookAppointmentModal){
<app-modal-form [config]="bookAppointmentModalConfig" [fields]="appointmentModalFields"
  (submitted)="onSubmitAppointment($event)" (cancelled)="showBookAppointmentModal = false"
  (backdropClicked)="showBookAppointmentModal = false">
</app-modal-form>
}

@if(showEditProfileModal){
<app-modal-form [config]="editProfileModalConfig" [fields]="profileModalFields" (submitted)="onUpdateProfile($event)"
  (cancelled)="showEditProfileModal = false" (backdropClicked)="showEditProfileModal = false">
</app-modal-form>
}
