<div class="section-header">
  <h2>Welcome Back, Patient</h2>
  <!-- <p>Here's an overview of the hospital today</p> -->
</div>

<div class="stat-grid">
  @for(cardDetail of cardDetails; track $index){
  <div [ngClass]="cardDetail.cardColor" (click)="cardDetail.action()"
    class="flex min-w-65 items-center gap-5 p-6 bg-white rounded-2xl border border-slate-200 shadow-sm cursor-pointer transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">

    <div class="flex items-center justify-center size-16 shrink-0 rounded-xl">
      <div 
        [style.mask]="'url(' + cardDetail.icon + ') no-repeat'"
        [style.webkit-mask-image]="'url(' + cardDetail.icon + ')'"
        [style.background-color]="cardDetail.cardColor"
        class="svg-mask-icon size-8 bg-current w-15 h-15">
      </div>
    </div>

    <!-- Text Info -->
    <div class="flex flex-col gap-1">
      <h1 class="text-xl font-extrabold text-slate-900 leading-none tracking-tight">
        {{ cardDetail.value }}
      </h1>
      <!-- <h3 class="text-sm font-medium text-slate-500">
        {{ cardDetail.label }}
      </h3> -->
    </div>
  </div>
  }
</div>
<div class="dash-panel">
  <div class="panel-header">
    <h3>Recent Appointments</h3>
    <button class="view-all-btn">View All →</button>
  </div>
  <app-data-table 
    [columns]="appointmentColumns" 
    [data]="appointments()" 
    [actions]="[]"
    [emptyStateMessage]="'No appointments found'">
  </app-data-table>
</div>

<!-- Appointment Booking Modal -->
<app-modal-form 
  [isOpen]="isAppointmentModalOpen"
  [config]="appointmentModalConfig"
  [fields]="appointmentModalFields"
  (submitted)="handleAppointmentSubmit($event)"
  (cancelled)="handleAppointmentCancel()"
  (backdropClicked)="handleAppointmentBackdropClick()"
/>

<!-- Profile Update Modal -->
<app-modal-form 
  [isOpen]="isProfileModalOpen"
  [config]="profileModalConfig"
  [fields]="profileModalFields"
  (submitted)="handleProfileSubmit($event)"
  (cancelled)="handleProfileCancel()"
  (backdropClicked)="handleProfileBackdropClick()"
/>
