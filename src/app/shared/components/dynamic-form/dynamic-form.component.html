<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="space-y-6 p-8 rounded-2xl shadow-xl transition-all duration-300 border"
  style="background-color: var(--brand-surface); border-color: var(--brand-accent);"
>
  @for(field of config.fields; track $index) {
    <ng-container>

      @if(field.type !== 'select' && field.type !== 'textarea') {
      <div>
        <label class="block text-sm font-semibold mb-1.5 transition-colors" 
               style="color: var(--brand-primary)">
          {{ field.label }}
        </label>

        <input
          [type]="field.type"
          [placeholder]="field.placeholder"
          formControlName="{{ field.name }}"
          class="w-full px-4 py-2.5 rounded-lg border-2 outline-none transition-all focus:ring-4"
          style="
            background-color: var(--brand-surface); 
            border-color: var(--brand-accent); 
            color: inherit;
            --tw-ring-color: rgba(0, 151, 167, 0.2);
          "
          onfocus="this.style.borderColor='var(--brand-primary)'"
          onblur="this.style.borderColor='var(--brand-accent)'"
        />
        <div *ngIf="form.get(field.name)?.invalid && form.get(field.name)?.touched" class="text-red-500 text-xs mt-1 font-medium">
          {{ field.label }} is required
        </div>
      </div>
      }

      @if(field.type === 'textarea') {
        <div>
          <label class="block text-sm font-semibold mb-1.5" style="color: var(--brand-primary)">
            {{ field.label }}
          </label>

          <textarea
            [placeholder]="field.placeholder"
            formControlName="{{ field.name }}"
            class="w-full px-4 py-2.5 rounded-lg border-2 outline-none transition-all min-h-[100px]"
            style="background-color: var(--brand-surface); border-color: var(--brand-accent); color: inherit;"
            onfocus="this.style.borderColor='var(--brand-primary)'"
            onblur="this.style.borderColor='var(--brand-accent)'"
          ></textarea>
          <div *ngIf="form.get(field.name)?.invalid && form.get(field.name)?.touched" class="text-red-500 text-xs mt-1 font-medium">
            {{ field.label }} is required
          </div>
        </div>
      }

      @if(field.type === 'select') {
        <div>
          <label class="block text-sm font-semibold mb-1.5" style="color: var(--brand-primary)">
            {{ field.label }}
          </label>

          <select 
            formControlName="{{ field.name }}" 
            class="w-full px-4 py-2.5 rounded-lg border-2 outline-none transition-all cursor-pointer"
            style="background-color: var(--brand-surface); border-color: var(--brand-accent); color: inherit;"
            onfocus="this.style.borderColor='var(--brand-primary)'"
            onblur="this.style.borderColor='var(--brand-accent)'"
          >
            @for (opt of field.options; track $index) {
              <option [value]="opt.value">
                {{ opt.label }}
              </option>
            }
          </select>
          <div *ngIf="form.get(field.name)?.invalid && form.get(field.name)?.touched" class="text-red-500 text-xs mt-1 font-medium">
            {{ field.label }} is required
          </div>
        </div>
      }

    </ng-container>
  }

  <button
    type="submit"
    class="w-full mt-4 border-none px-6 py-3 rounded-lg font-bold text-white transition-all active:scale-95 shadow-md hover:brightness-110 disabled:opacity-50"
    style="background-color: var(--brand-primary);"
  >
    {{ config.submitLabel || 'Submit' }}
  </button>
</form>
